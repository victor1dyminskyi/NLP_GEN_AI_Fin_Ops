# Step 2 — the fictional company. EDIT FREELY: the generator reads only this file + catalog.csv.
#
# How a resource's daily cost is generated (Step 3):
#   quantity(day) = base_qty × count × weekday_factor × (1 + growth_per_month)^months × noise
#   cost(day)     = quantity(day) × ListUnitPrice   (price comes from catalog.csv = real FOCUS rows)
#
# base_qty units depend on the catalog item "kind":
#   hourly   → hours per day per instance (24 = runs all day)
#   storage  → GB stored (billed per GB-month, spread evenly over the days of the month)
#   transfer → GB per day

company:
  name: DemoShop            # fictional online shop with an ML recommendation engine
  billing_account_id: "900000000001"
  currency: USD

period:
  start: 2026-03-01
  end: 2026-08-31           # 6 months, daily rows
  seed: 42                  # same seed → same data, always

# Day-of-week multipliers, Monday → Sunday
weekday_profiles:
  flat:           [1.00, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00]   # servers that run 24/7, storage
  shop_traffic:   [0.95, 0.95, 0.95, 1.00, 1.05, 1.15, 1.15]   # online shop: busier on weekends
  office_hours:   [1.00, 1.00, 1.00, 1.00, 1.00, 0.35, 0.35]   # dev/BI: mostly off at weekends

# Default random noise per kind (± share of the value, multiplicative, seeded)
noise_defaults:
  hourly: 0.01
  storage: 0.005
  transfer: 0.15

teams:
  storefront: {owner: "Alex Moreno",  email: storefront-team@demoshop.example, slack: "#team-storefront"}
  payments:   {owner: "Priya Nair",   email: payments-team@demoshop.example,   slack: "#team-payments"}
  platform:   {owner: "Jonas Weber",  email: platform-team@demoshop.example,   slack: "#team-platform"}
  data:       {owner: "Mei Lin",      email: data-team@demoshop.example,       slack: "#team-data"}
  ml:         {owner: "Omar Haddad",  email: ml-team@demoshop.example,         slack: "#team-ml"}
  analytics:  {owner: "Sofia Rossi",  email: analytics-team@demoshop.example,  slack: "#team-analytics"}

# AWS accounts (SubAccount in FOCUS)
accounts:
  storefront-prod: {id: "900000000101", team: storefront, env: prod}
  storefront-dev:  {id: "900000000102", team: storefront, env: dev}
  payments-prod:   {id: "900000000201", team: payments,   env: prod}
  platform-shared: {id: "900000000301", team: platform,   env: prod}
  data-prod:       {id: "900000000401", team: data,       env: prod}
  ml-prod:         {id: "900000000501", team: ml,         env: prod}
  ml-dev:          {id: "900000000502", team: ml,         env: dev}
  analytics-prod:  {id: "900000000601", team: analytics,  env: prod}

# Resources. tags: false = resource has NO tags (legacy, exists from day 1 — this is "normal mess", not an anomaly)
# count = identical instances behind one resource (e.g. an auto-scaling group)
resources:
  # --- storefront (the shop website) ---
  - {id: sf-web-asg,      account: storefront-prod, sku: ec2_c5_2xlarge, base_qty: 24,    count: 6, profile: flat, noise: 0.05, app: web}
  - {id: sf-api-asg,      account: storefront-prod, sku: ec2_m5_xlarge,  base_qty: 24,    count: 4, profile: flat, noise: 0.05, app: api}
  - {id: sf-cache,        account: storefront-prod, sku: ec2_r5_xlarge,  base_qty: 24,    count: 2, profile: flat, app: cache}
  - {id: sf-alb,          account: storefront-prod, sku: alb_hours,      base_qty: 24,    profile: flat, app: web}
  - {id: sf-ebs,          account: storefront-prod, sku: ebs_gp3,        base_qty: 2000,  profile: flat, app: web}
  - {id: sf-egress,       account: storefront-prod, sku: dt_out_internet, base_qty: 400,  profile: shop_traffic, app: web}
  - {id: sf-logs,         account: storefront-prod, sku: cw_logs_ingest, base_qty: 20,    profile: shop_traffic, app: web}
  - {id: sf-dev-web,      account: storefront-dev,  sku: ec2_t3_medium,  base_qty: 24,    count: 4, profile: office_hours, app: web}
  - {id: sf-dev-db,       account: storefront-dev,  sku: rds_m5_large_pg, base_qty: 24,   profile: flat, app: web}
  # --- payments ---
  - {id: pay-api,         account: payments-prod,   sku: ec2_m5_large,   base_qty: 24,    count: 4, profile: flat, app: checkout}
  - {id: pay-alb,         account: payments-prod,   sku: alb_hours,      base_qty: 24,    profile: flat, app: checkout}
  - {id: pay-db,          account: payments-prod,   sku: rds_m5_large_multiaz_mysql, base_qty: 24, profile: flat, app: checkout}
  - {id: pay-db-snap,     account: payments-prod,   sku: ebs_snapshot,   base_qty: 500,   growth_per_month: 0.03, profile: flat, app: checkout}
  - {id: pay-logs,        account: payments-prod,   sku: cw_logs_ingest, base_qty: 5,     profile: shop_traffic, app: checkout}
  # --- platform (shared network + tooling) ---
  - {id: plat-nat-a,      account: platform-shared, sku: nat_hours,      base_qty: 24,    profile: flat, app: network}
  - {id: plat-nat-b,      account: platform-shared, sku: nat_hours,      base_qty: 24,    profile: flat, app: network}
  - {id: plat-nat-traffic, account: platform-shared, sku: nat_gb,        base_qty: 300,   profile: shop_traffic, app: network}
  - {id: plat-inter-az,   account: platform-shared, sku: dt_inter_az,    base_qty: 2000,  profile: shop_traffic, app: network}
  - {id: plat-bastion,    account: platform-shared, sku: ec2_t3_medium,  base_qty: 24,    profile: flat, app: access}
  - {id: plat-monitoring, account: platform-shared, sku: ec2_m5_large,   base_qty: 24,    count: 2, profile: flat, app: monitoring}
  - {id: plat-log-archive, account: platform-shared, sku: s3_standard,   base_qty: 15000, growth_per_month: 0.05, profile: flat, app: logging}
  # --- data engineering ---
  - {id: data-etl-workers, account: data-prod,      sku: ec2_r5_xlarge,  base_qty: 24,    count: 4, profile: flat, app: etl, workload: batch}
  - {id: data-warehouse,  account: data-prod,       sku: rds_m5_large_pg, base_qty: 24,   count: 2, profile: flat, app: warehouse}
  - {id: data-lake,       account: data-prod,       sku: s3_standard,    base_qty: 80000, growth_per_month: 0.04, profile: flat, app: lake}
  - {id: data-replication, account: data-prod,      sku: dt_inter_region, base_qty: 150,  profile: flat, noise: 0.10, app: lake}
  - {id: data-ebs,        account: data-prod,       sku: ebs_gp3,        base_qty: 4000,  profile: flat, app: etl}
  # --- ML (recommendations) ---
  - {id: ml-inference,    account: ml-prod,         sku: ec2_g5_4xlarge, base_qty: 24,    count: 2, profile: flat, app: recommender}
  - {id: ml-feature-store, account: ml-prod,        sku: ec2_r5_xlarge,  base_qty: 24,    count: 2, profile: flat, app: recommender}
  - {id: ml-models-s3,    account: ml-prod,         sku: s3_standard,    base_qty: 5000,  growth_per_month: 0.06, profile: flat, app: recommender}
  - {id: ml-inference-logs, account: ml-prod,       sku: cw_logs_ingest, base_qty: 8,     profile: shop_traffic, app: recommender}
  - {id: ml-notebooks,    account: ml-dev,          sku: ec2_m5_2xlarge, base_qty: 24,    count: 2, profile: office_hours, app: research}
  - {id: ml-dev-ebs,      account: ml-dev,          sku: ebs_gp3,        base_qty: 1500,  profile: flat, app: research}
  # --- analytics (BI dashboards) ---
  - {id: bi-server,       account: analytics-prod,  sku: ec2_m5_xlarge,  base_qty: 24,    count: 2, profile: flat, app: dashboards}
  - {id: bi-db,           account: analytics-prod,  sku: rds_m5_large_pg, base_qty: 24,   profile: flat, app: dashboards}
  - {id: bi-extracts,     account: analytics-prod,  sku: s3_standard,    base_qty: 3000,  growth_per_month: 0.02, profile: flat, app: dashboards}
  - {id: bi-egress,       account: analytics-prod,  sku: dt_out_internet, base_qty: 30,   profile: office_hours, app: dashboards}
  # --- legacy, untagged from day 1 (realistic background mess) ---
  - {id: legacy-ftp,      account: platform-shared, sku: ec2_t3_medium,  base_qty: 24,    profile: flat, tags: false}
  - {id: old-snapshots,   account: data-prod,       sku: ebs_snapshot,   base_qty: 3000,  profile: flat, tags: false}

# Savings Plan: these resources get a discounted unit price while the plan is active.
# Its expiry date is NOT set here — expiring it is an anomaly, configured in Step 5 (anomalies.yaml).
commitments:
  - id: sp-compute-2025
    type: Savings Plan
    discount: 0.30          # ASSUMPTION: 30% off on-demand (real sample rows had $0 costs, so no real rate available)
    covers: [sf-web-asg, sf-api-asg, data-etl-workers]
    start: 2025-09-01
    managed_by: platform    # team responsible for buying/renewing commitments (design choice)
    end: 2026-09-01         # 1-year term (AWS Savings Plans are sold as 1- or 3-year terms); ends just after our window

# ---------------- Step 4: side tables ----------------
# Usage metrics (EC2 servers only — that is where idle/busy matters).
utilization:
  # CPU: per-fleet average drawn from a log-normal fitted to REAL per-VM averages
  # (Azure Public Dataset V2, 237,558 VMs alive ≥ 7 days) → data/raw/azure_vm_2019/cpu_utilization_summary.csv
  # Mapping: workload "interactive" (default) → Azure "Interactive"; "batch" → Azure "Delay-insensitive".
  # GPU: TESTED setting (3 published levels for inference GPUs):
  #   easy 25  — production GPU utilization "25% to below 50%" (Weng et al., ATC'23)
  #   medium 20 — median SM activity, Alibaba PAI (NSDI'24 Acme slides)
  #   hard 6   — median SM utilization of online inference, Alibaba ASI (OSDI'26)
  gpu_inference_median: 20
  # Day-to-day variation of a server's load: TESTED setting (per-VM averages can't show it)
  daily_noise: 0.15

# Change log (CloudTrail-style). Design choices — they happen before the observed window,
# so they don't affect detection: resources that exist from day 1 were created at a random
# time in the 12 months before period.start, by their team owner.
change_log:
  history_days_before_start: 365
  legacy_actor: legacy-admin      # who created the untagged legacy resources (left the company)
  scheduler_actor: instance-scheduler   # stops office_hours servers on Saturday, starts them on Monday
