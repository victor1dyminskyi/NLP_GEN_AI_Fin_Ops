# Step 5 — planted anomalies & decoys. Read by src/data_gen/build_datasets.py.
# A replica has the SAME items, resources and dates in every difficulty → only difficulty changes.
# The NUMBER of items differs per replica (random spread of the totals below), so nobody — agent or
# developer — can rely on "every dataset has N anomalies".

replicas: 5

# How many of each item type over the 5 replicas (per difficulty).
totals:
  idle_gpu: 6
  transfer_spike: 6
  transfer_drift: 6
  untagged_resource: 6
  orphaned_disk: 6
  sp_expired: 4                    # one Savings Plan → at most 1 per replica
  decoy_planned_training: 6
  decoy_marketing_campaign: 4      # one campaign resource → at most 1 per replica
  decoy_feature_launch: 5
max_per_replica: {sp_expired: 1, decoy_marketing_campaign: 1, transfer_spike: 2, transfer_drift: 2}
max_items_per_replica: 12          # keeps enough normal history in every dataset
# Showcase replica (demo video) contains every type at least once.

# Where items may be planted (variety for owner attribution)
spike_resources: [data-replication, bi-egress]
drift_resources: [plat-nat-traffic, plat-inter-az]
untagged_accounts: [storefront-dev, ml-dev]
orphan_accounts: [data-prod, analytics-prod]
launch_accounts: [payments-prod, storefront-prod]
dev_replicas: [1, 2]        # practice: allowed to look at failures and improve the agent
test_replicas: [3, 4, 5]    # final exam: run only at the end, report these scores
seed: 2026

warmup_days: 42             # first 6 weeks clean: the detector needs normal history (design choice)
min_visible_days: 14        # each item starts ≥ 14 days before the window ends, so it can be seen
min_gap_days: 3             # item start dates are ≥ 3 days apart (less overlap, cleaner labels)
showcase: {replica: 1, sp_expiry: 2026-07-01}   # replica 1 = demo dataset; SP expires July 1

# TESTED settings — no public data on "how big real anomalies are", so we test several levels.
difficulties:
  easy:
    gpu_inference_median: 25        # normal inference GPU load (ATC'23)
    noise_scale: 0.33               # ×0.33 of base noise (traffic ±5%)
    spike_factor: 10                # data-transfer spike size
    drift_to: 3.0                   # gradual NAT growth reaches ×3
    untagged: {sku: ec2_c5_4xlarge, count: 2}     # ≈ $33/day
  medium:
    gpu_inference_median: 20        # Alibaba PAI
    noise_scale: 1.0                # base noise (traffic ±15%)
    spike_factor: 3
    drift_to: 2.0
    untagged: {sku: ec2_c5_4xlarge, count: 2}
  hard:
    gpu_inference_median: 6         # Alibaba ASI (OSDI'26)
    noise_scale: 2.0                # traffic ±30%
    spike_factor: 1.5
    drift_to: 1.3
    untagged: {sku: ec2_t3_medium, count: 1}      # ≈ $1/day — tests the limit of detection

# DESIGN CHOICES shared by all difficulties (they shape the story, not the difficulty)
gpu_training_pct: 80        # GPU busy during training; what matters is the idle phase after
gpu_idle_pct: 0.5           # idle = nothing running
training_days: 3
spike_days: 7
drift_days: 14
campaign: {factor: 2.0, days: 4}                  # D2: planned marketing campaign
orphan: {server_sku: ec2_m5_xlarge, server_days: 14, disk_gb: 2000}
feature_launch: {sku: ec2_m5_xlarge, count: 4}    # D3: new tagged service with ticket

# What the agent SHOULD do (answer key). tier: auto = may act alone; approval = human must approve
actions:
  idle_gpu:          {action: stop_instance,              tier: approval}
  transfer_spike:    {action: notify_owner_open_ticket,   tier: auto}
  transfer_drift:    {action: notify_owner_open_ticket,   tier: auto}
  untagged_resource: {action: tag_and_notify_owner,       tier: auto}
  sp_expired:        {action: recommend_sp_renewal,       tier: approval}
  orphaned_disk:     {action: snapshot_then_delete_volume, tier: approval}
  decoy:             {action: no_action,                  tier: none}
