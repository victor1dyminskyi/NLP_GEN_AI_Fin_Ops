<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 600" font-family="-apple-system, system-ui, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b85"/>
    </marker>
    <marker id="arrd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a96ab"/>
    </marker>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1f2a44" flood-opacity="0.12"/>
    </filter>
    <radialGradient id="glow"><stop offset="0" stop-color="#ff5a5f"/><stop offset="1" stop-color="#ff5a5f" stop-opacity="0"/></radialGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1340" height="600" rx="18" fill="#f6f8fc"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#1f2a44">How one anomaly travels through the system</text>
  <text x="30" y="64" font-size="13.5" fill="#5b6b85">Example from the practice data: a GPU server finished training, nobody switched it off — $136 per day for nothing.</text>

  <!-- ===== 1. tables ===== -->
  <text x="30" y="102" font-size="14" font-weight="700" fill="#3b5bdb">① 5 TABLES</text>
  <g font-size="12.5" fill="#1f2a44">
    <g filter="url(#sh)">
      <rect x="30" y="114" width="190" height="52" rx="10" fill="#fff" stroke="#d6dcea"/>
      <rect x="30" y="176" width="190" height="52" rx="10" fill="#fff" stroke="#d6dcea"/>
      <rect x="30" y="238" width="190" height="52" rx="10" fill="#fff" stroke="#d6dcea"/>
      <rect x="30" y="300" width="190" height="52" rx="10" fill="#fff" stroke="#d6dcea"/>
      <rect x="30" y="362" width="190" height="52" rx="10" fill="#fff" stroke="#d6dcea"/>
    </g>
    <text x="44" y="137" font-size="17">💵</text><text x="72" y="136" font-weight="700">Bill</text><text x="72" y="154" fill="#5b6b85" font-size="11.5">cost per resource per day</text>
    <text x="44" y="199" font-size="17">📈</text><text x="72" y="198" font-weight="700">Usage</text><text x="72" y="216" fill="#5b6b85" font-size="11.5">how busy: CPU % / GPU %</text>
    <text x="44" y="261" font-size="17">📝</text><text x="72" y="260" font-weight="700">Change log</text><text x="72" y="278" fill="#5b6b85" font-size="11.5">who created what, tickets</text>
    <text x="44" y="323" font-size="17">👥</text><text x="72" y="322" font-weight="700">Owners</text><text x="72" y="340" fill="#5b6b85" font-size="11.5">team, contact, Slack</text>
    <text x="44" y="385" font-size="17">🏷️</text><text x="72" y="384" font-weight="700">Savings Plans</text><text x="72" y="402" fill="#5b6b85" font-size="11.5">discounts and end dates</text>
  </g>

  <!-- arrow tables -> detector -->
  <path d="M222,264 L262,264" stroke="#5b6b85" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- ===== 2. detector ===== -->
  <text x="268" y="102" font-size="14" font-weight="700" fill="#0b7285">② DETECTOR</text>
  <text x="372" y="102" font-size="11.5" fill="#5b6b85">code · no AI · 1 second</text>
  <g filter="url(#sh)"><rect x="268" y="114" width="230" height="190" rx="12" fill="#fff" stroke="#9fd6de" stroke-width="1.5"/></g>
  <text x="284" y="138" font-size="12.5" fill="#1f2a44" font-weight="700">Checks every resource, every day:</text>
  <g font-size="12" fill="#1f2a44">
    <text x="284" y="164">📊 cost unusual vs last 28 days?</text>
    <text x="284" y="190">💲 price per hour jumped?</text>
    <text x="284" y="216">🆕 something new costs money?</text>
    <text x="284" y="242">💾 disk left without its server?</text>
  </g>
  <text x="284" y="276" font-size="11.5" fill="#5b6b85">~7,500 rows → a handful of alerts</text>
  <text x="284" y="292" font-size="11.5" fill="#5b6b85">"where to look"</text>

  <!-- alert sticky note -->
  <path d="M383,306 L383,334" stroke="#5b6b85" stroke-width="2" marker-end="url(#arr)"/>
  <g filter="url(#sh)">
    <rect x="268" y="338" width="230" height="86" rx="10" fill="#fff4e6" stroke="#ffa94d" stroke-width="1.5">
      <animate attributeName="stroke-width" values="1.5;3.5;1.5" dur="1.6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="282" y="362" font-size="13" font-weight="700" fill="#d9480f">🚨 ALERT</text>
  <text x="282" y="382" font-size="12" fill="#1f2a44">ml-train-72 · new GPU server</text>
  <text x="282" y="400" font-size="12" fill="#1f2a44">$136 per day since 7 July</text>
  <text x="282" y="416" font-size="11" fill="#5b6b85">→ handed to the AI</text>

  <!-- arrow alert -> agent -->
  <path d="M500,380 C520,380 520,300 552,300" stroke="#5b6b85" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- ===== 3. agent ===== -->
  <text x="536" y="102" font-size="14" font-weight="700" fill="#7048e8">③ AI AGENT</text>
  <text x="634" y="102" font-size="11.5" fill="#5b6b85">local LLM · decides what to check</text>
  <g filter="url(#sh)"><rect x="536" y="114" width="300" height="310" rx="12" fill="#fff" stroke="#c5b5f7" stroke-width="1.5"/></g>
  <g font-size="12">
    <!-- Q1 -->
    <rect x="550" y="128" width="190" height="26" rx="13" fill="#f0ebff"/>
    <text x="562" y="146" fill="#4c2fb5">🤖 Is it actually doing anything?</text>
    <rect x="626" y="160" width="196" height="26" rx="13" fill="#e9f7ef"/>
    <text x="636" y="178" fill="#1e6b3a">🔧 usage: GPU 86% → 0.5%</text>
    <!-- Q2 -->
    <rect x="550" y="198" width="190" height="26" rx="13" fill="#f0ebff"/>
    <text x="562" y="216" fill="#4c2fb5">🤖 Was it planned?</text>
    <rect x="586" y="230" width="236" height="26" rx="13" fill="#e9f7ef"/>
    <text x="596" y="248" fill="#1e6b3a">🔧 change log: omar.haddad, no ticket</text>
    <!-- Q3 -->
    <rect x="550" y="268" width="190" height="26" rx="13" fill="#f0ebff"/>
    <text x="562" y="286" fill="#4c2fb5">🤖 Who is responsible?</text>
    <rect x="626" y="300" width="196" height="26" rx="13" fill="#e9f7ef"/>
    <text x="636" y="318" fill="#1e6b3a">🔧 owners: ML team · #team-ml</text>
    <!-- conclusion -->
    <rect x="550" y="342" width="272" height="66" rx="10" fill="#f8f9fb" stroke="#e1e5ee"/>
    <text x="562" y="364" fill="#1f2a44" font-weight="700">💭 Judgement</text>
    <text x="562" y="382" fill="#1f2a44">Busy 3 days, idle ever since, no ticket →</text>
    <text x="562" y="399" fill="#1f2a44">a forgotten GPU, not a planned job.</text>
  </g>

  <!-- tools read tables (dashed, curved under) -->
  <path d="M686,426 C686,520 140,520 125,418" stroke="#8a96ab" stroke-width="1.6" stroke-dasharray="6 5" fill="none" marker-end="url(#arrd)"/>
  <rect x="300" y="494" width="268" height="24" rx="12" fill="#eef1f7"/>
  <text x="312" y="511" font-size="12" fill="#5b6b85">🔧 8 read-only tools query the 5 tables</text>

  <!-- arrow agent -> report -->
  <path d="M818,268 L852,268" stroke="#5b6b85" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- ===== 4. report ===== -->
  <text x="876" y="102" font-size="14" font-weight="700" fill="#2b8a3e">④ REPORT</text>
  <g filter="url(#sh)"><rect x="876" y="114" width="214" height="310" rx="12" fill="#fff" stroke="#a9dfb5" stroke-width="1.5"/></g>
  <g font-size="12" fill="#1f2a44">
    <text x="890" y="140" fill="#5b6b85">Cause</text><text x="970" y="140" font-weight="700">Idle GPU</text>
    <text x="890" y="164" fill="#5b6b85">Owner</text><text x="970" y="164" font-weight="700">ML team</text>
    <text x="890" y="188" fill="#5b6b85">Proposal</text><text x="970" y="188" font-weight="700">stop the server</text>
    <text x="890" y="212" fill="#5b6b85">Confidence</text><text x="970" y="212" font-weight="700">0.9</text>
    <line x1="890" y1="226" x2="1076" y2="226" stroke="#e6e9f0"/>
    <text x="890" y="248" font-weight="700">💬 Message to #team-ml</text>
    <rect x="888" y="258" width="190" height="150" rx="10" fill="#f3f6ff"/>
    <text x="900" y="280">ml-train-72 has used ~0.5%</text>
    <text x="900" y="298">of its GPU since its training</text>
    <text x="900" y="316">run ended, but still costs</text>
    <text x="900" y="334" font-weight="700">$136 per day.</text>
    <text x="900" y="356">Proposed: stop it.</text>
    <text x="900" y="374">Waiting for approval.</text>
    <text x="900" y="398" font-size="10.5" fill="#5b6b85">(illustrative wording)</text>
  </g>

  <!-- arrow report -> gate -->
  <path d="M1072,268 L1102,268" stroke="#5b6b85" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- ===== 5. gate ===== -->
  <text x="1126" y="102" font-size="14" font-weight="700" fill="#c92a2a">⑤ GATE</text>
  <text x="1190" y="102" font-size="11.5" fill="#5b6b85">code</text>
  <g filter="url(#sh)"><rect x="1126" y="114" width="190" height="310" rx="12" fill="#fff" stroke="#f1b0b0" stroke-width="1.5"/></g>
  <g font-size="11.5" fill="#1f2a44">
    <rect x="1136" y="126" width="170" height="78" rx="9" fill="#ebfbee"/>
    <text x="1144" y="146" font-weight="700">🟢 low risk</text>
    <text x="1144" y="164">notify, add tags</text>
    <text x="1144" y="182">→ done automatically</text>
    <text x="1144" y="196" font-size="10" fill="#5b6b85">(simulated)</text>

    <rect x="1136" y="212" width="170" height="96" rx="9" fill="#fff4e6" stroke="#ffa94d" stroke-width="2">
      <animate attributeName="stroke-opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <text x="1144" y="232" font-weight="700">🟠 risky</text>
    <text x="1144" y="250">stop, delete, renew</text>
    <text x="1144" y="268">→ a human decides</text>
    <rect x="1144" y="278" width="84" height="22" rx="6" fill="#2b8a3e"/><text x="1152" y="294" fill="#fff" font-weight="700">✅ Approve</text>
    <rect x="1234" y="278" width="72" height="22" rx="6" fill="#adb5bd"/><text x="1241" y="294" fill="#fff" font-weight="700">❌ Reject</text>

    <rect x="1136" y="316" width="170" height="78" rx="9" fill="#fff5f5"/>
    <text x="1144" y="336" font-weight="700">🔴 unsure</text>
    <text x="1144" y="354">confidence &lt; 0.6</text>
    <text x="1144" y="372">→ a human investigates</text>
    <text x="1144" y="410" font-size="10.5" fill="#5b6b85">The AI never approves itself.</text>
  </g>

  <!-- ===== moving "packet": the anomaly travelling ===== -->
  <path id="journey" d="M222,264 L262,264 M368,306 L368,334 M470,380 C490,380 492,300 512,300 M818,268 L852,268 M1072,268 L1102,268 L1116,260" fill="none" stroke="none"/>
  <g>
    <circle r="11" fill="url(#glow)">
      <animateMotion dur="7s" repeatCount="indefinite" keyPoints="0;0.08;0.14;0.30;0.36;0.62;0.70;0.92;1" keyTimes="0;0.08;0.2;0.3;0.45;0.55;0.7;0.85;1" calcMode="linear"
        path="M126,264 L300,240 L383,320 L383,380 L500,380 C520,380 520,300 580,250 L720,260 L840,268 L980,250 L1094,268 L1215,255"/>
    </circle>
    <circle r="5" fill="#ff5a5f">
      <animateMotion dur="7s" repeatCount="indefinite" keyPoints="0;0.08;0.14;0.30;0.36;0.62;0.70;0.92;1" keyTimes="0;0.08;0.2;0.3;0.45;0.55;0.7;0.85;1" calcMode="linear"
        path="M126,264 L300,240 L383,320 L383,380 L500,380 C520,380 520,300 580,250 L720,260 L840,268 L980,250 L1094,268 L1215,255"/>
    </circle>
  </g>

  <!-- bottom caption -->
  <text x="30" y="560" font-size="13" fill="#1f2a44"><tspan font-weight="700">Code</tspan> does what must be exact (check every number, every day; decide what may run alone).</text>
  <text x="30" y="580" font-size="13" fill="#1f2a44"><tspan font-weight="700">The AI</tspan> does what needs judgement (what to check, what the evidence means, what to tell whom).</text>
</svg>
